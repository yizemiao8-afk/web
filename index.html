<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>灯芯镇最后的灯 · Demo</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
  <canvas id="game" width="1152" height="648"></canvas>

  <!-- UI 覆盖层：与画布同坐标系（1152×648），由 JS 统一缩放 -->
  <div id="ui">

    <!-- 开始菜单：只有一行闪烁的手势提示（点击画面同样可以开始） -->
    <div id="menu-ui" class="layer hidden">
      <div id="menu-start-hint">🖐 张开手掌进入游戏</div>
    </div>

    <!-- 开场 CG -->
    <div id="cg-ui" class="layer hidden">
      <div id="cg-subtitle"></div>
      <div id="cg-hint">点击继续...</div>
    </div>

    <!-- 点灯剧情对话（视觉小说式） -->
    <div id="dialogue-ui" class="layer hidden">
      <div id="dlg-band"></div>
      <img id="dlg-portrait" src="assets/portrait/jin.webp" alt="烬">
      <div id="dlg-name">烬</div>
      <div id="dlg-text"></div>
      <div id="dlg-next">🖐 ▼</div>
    </div>

    <!-- 触屏控件（在 #ui 内随画面统一缩放；点灯按钮仅触屏设备显示） -->
    <button id="btn-light" class="hidden">点灯</button>
    <div id="touch-hint" class="hidden">按住左 / 右半屏移动 · 上滑跳跃 · 靠近路灯点「点灯」</div>

    <!-- 摄像头手势控制：小窗预览 + 状态提示（按 C 可隐藏小窗） -->
    <video id="cam-preview" autoplay muted playsinline></video>
    <div id="gesture-status"></div>

    <!-- 手势调试面板（按 V 开关） -->
    <div id="gesture-debug" class="hidden">
      <div id="gd-gesture">手势：—</div>
      <div id="gd-event">触发：—</div>
      <div id="gd-bar"><div id="gd-dead"></div><div id="gd-dot"></div></div>
      <div id="gd-move">移动：—</div>
      <div id="gd-fps">识别：— fps</div>
    </div>

  </div>
</div>

<!-- 竖屏提示（仅触屏设备竖屏时显示） -->
<div id="rotate-hint">↻ 建议横屏游玩，体验更佳</div>

<!-- 手势解密小游戏（全屏覆盖，p5 + MediaPipe，与主游戏通过 postMessage 通信） -->
<iframe id="puzzle-frame" class="hidden" allow="camera" title="星盘解密"></iframe>

<script src="js/tiles.js"></script>
<script src="js/game.js"></script>
</body>
</html>
