<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>星盘解密 · 灯芯镇最后的灯</title>
  <link rel="stylesheet" href="style.css">
  <!-- p5.js 与 MediaPipe 均为本地文件，无需联网 -->
  <script src="lib/p5.min.js"></script>
  <script src="constellations.js"></script>
  <script src="sketch.js"></script>
</head>
<body>
  <!-- 没有主菜单：随 iframe 打开直接进入星空 -->

  <!-- ESC 手势教程页 -->
  <div id="tutorial" class="hidden">
    <div class="card">
      <h1>星盘解密 · 手势教程</h1>
      <p class="sub">转动十二星座星盘，显现出本关星座，灯火便会亮起</p>
      <ul>
        <li>🖐 <b>张开手掌</b> → 召唤十二星座星盘（外圈与中圈已乱序）</li>
        <li>🌀 <b>拧动手掌</b> → 转动星盘：让外圈与中圈的同一星座对齐</li>
        <li>🤏 <b>拇指 + 食指捏合</b> → 星盘对齐后，显现本关星座</li>
        <li>☝️ <b>食指向上</b> → 在指尖点亮一颗引导星（装饰）</li>
        <li>✨ 星座完全显现后，自动返回灯芯镇，路灯随之点亮</li>
        <li>按键：<kbd>ESC</kbd> 打开 / 关闭本教程 · <kbd>V</kbd> 摄像头画面 · <kbd>I</kbd> 手势信息</li>
      </ul>
      <p class="tip">提示：需要允许浏览器使用摄像头；把手伸到摄像头前，光线充足识别更稳。</p>
      <p class="back">按 <kbd>ESC</kbd> 或点击此处返回星盘</p>
    </div>
  </div>

  <div id="status"></div>
</body>
</html>
